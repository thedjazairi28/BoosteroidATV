name: Build BoosteroidATV experimental tvOS IPA

on:
  push:
    branches:
      - feature/unified-catalog-v1
      - feature/v2-smart-experience
      - feature/v2.1-stability
      - feature/v2.2-multi-store-filters
      - feature/v2.3-french-trailers
      - feature/v2.3.1-video-diagnostics
      - feature/v2.3.2-hls-trailers
      - feature/v2.3.3-clean-game-cards
      - feature/v2.4-gamepad-pointer
      - feature/v2.4.2-safe-launch
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Unsigned Apple TV IPA
    runs-on: macos-26
    timeout-minutes: 35
    steps:
      - name: Checkout fork
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build unsigned IPA
        run: |
          chmod +x scripts/build-ipa.sh
          VERSION=2026.11.22.9 ./scripts/build-ipa.sh

      - name: Upload unsigned IPA for atvloadly
        uses: actions/upload-artifact@v4
        with:
          name: BoosteroidATV-v2-4-2-safe-launch-unsigned
          path: build/*.ipa
          if-no-files-found: error
          retention-days: 7
