name: Publish approved Apple TV release

# Deliberately manual: a successful build does not establish that a
# streaming/game-launch change works on a real Apple TV.
on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: "Tested source branch or commit SHA (for example feature/v2.4.8-xbox-card-safe-mode)"
        required: true
        type: string
      release_version:
        description: "Unique version, e.g. 2026.11.22.16 (must increase for an update)"
        required: true
        type: string
      confirmation:
        description: "Type PUBLISH to approve distribution to Apple TVs tracking Releases"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: boosteroidatv-release
  cancel-in-progress: false

jobs:
  publish:
    name: Build, package, then publish approved tvOS IPA
    if: ${{ inputs.confirmation == 'PUBLISH' }}
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - name: Validate release parameters
        env:
          SOURCE_REF: ${{ inputs.source_ref }}
          RELEASE_VERSION: ${{ inputs.release_version }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_VERSION" =~ ^[0-9]{4}\.[0-9]{2}\.[0-9]{2}\.[0-9]+$ ]] || {
            echo "Version must look like 2026.11.22.16" >&2; exit 1;
          }
          [[ "$SOURCE_REF" =~ ^(feature/[A-Za-z0-9._/-]+|[a-f0-9]{40})$ ]] || {
            echo "Use a feature branch or full 40-character commit SHA." >&2; exit 1;
          }

      - name: Checkout tested source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref }}
          persist-credentials: false

      - name: Build unsigned tvOS IPA
        env:
          VERSION: ${{ inputs.release_version }}
        run: |
          set -euo pipefail
          chmod +x scripts/build-ipa.sh
          ./scripts/build-ipa.sh
          test "$(find build -maxdepth 1 -name '*.ipa' | wc -l | tr -d ' ')" = "1"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_VERSION: ${{ inputs.release_version }}
          SOURCE_REF: ${{ inputs.source_ref }}
        run: |
          set -euo pipefail
          tag="v${RELEASE_VERSION}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release already exists: $tag. Choose a new version." >&2
            exit 1
          fi
          sha="$(git rev-parse HEAD)"
          ipa="$(find build -maxdepth 1 -name '*.ipa' -type f -print -quit)"
          test -n "$ipa"
          printf "Publishing %s from %s (%s)\n" "$tag" "$SOURCE_REF" "$sha"
          gh release create "$tag" "$ipa" \
            --target "$sha" \
            --title "BoosteroidATV $tag" \
            --notes "Apple TV tvOS unsigned IPA; install and sign using atvloadly. Manually approved source: $SOURCE_REF ($sha)."

      - name: Summary
        env:
          RELEASE_VERSION: ${{ inputs.release_version }}
        run: |
          echo "Release published: https://github.com/${GITHUB_REPOSITORY}/releases/tag/v${RELEASE_VERSION}" >> "$GITHUB_STEP_SUMMARY"
